name: Documentation
description: Something in the docs is missing, wrong, or hard to follow.
labels: ["documentation"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's missing or wrong
      description: Point at the page or section, and say what a reader ends up confused about.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested change (optional)
      description: The wording, the missing example, or the section you'd add. Leave blank if you only know something is off.
    validations:
      required: false
