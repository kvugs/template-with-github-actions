# Auto-merge only locked development-tool minor/patch updates. Runtime changes,
# major versions, Actions, and pre-commit hooks still need human judgment.
# GitHub waits for every required status check before completing the merge.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      contents: write # Required by `gh pr merge`.
      pull-requests: write # Read metadata and enable auto-merge.
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for development-tool minor/patch updates
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
