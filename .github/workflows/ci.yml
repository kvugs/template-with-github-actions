# REQUIRED gate. Project checks reproduce locally through `just ci`; template
# maintainers run the additional materialization check through `just template-ci`.
# Slower and advisory-only checks live in informational.yml.
#
# Do not add `paths-ignore`: a skipped required workflow can leave its check in
# "Expected" forever and deadlock a pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    name: template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just template-ci

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked ruff format --check .
      - run: scripts/check-lock-index.sh
      - run: scripts/check-static.sh

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --locked basedpyright

  test-fast:
    # Named for what the job is for, not for the marker it selects on. Renaming
    # a required context means updating .github/rulesets/main.json and applying
    # it with scripts/setup-repo.sh *before* the rename merges, or the old name
    # sits in "Expected" forever and deadlocks every open pull request.
    name: test-fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --locked pytest -m "not external"

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: scripts/check-package.sh
